<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a170d"><title>FS Delivery — Cardápio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="store-body"><header class="store-header"><div class="container store-top"><div class="store-brand"><div class="store-logo">FS</div><div class="store-info"><h1 id="public-store-name">FS Delivery</h1><p id="public-store-meta">Carregando cardápio...</p></div></div><div class="inline-actions"><a class="btn btn-secondary" href="cliente.html">Meus pedidos</a><span class="store-status" id="public-store-status">Carregando</span></div></div></header><main class="store-main container"><div class="store-layout"><section><div class="category-tabs" id="category-tabs"></div><div id="menu-content"></div></section><aside class="cart"><h2>Seu pedido</h2><div id="cart-items"></div><div class="cart-total"><span>Total</span><span id="cart-total">R$ 0,00</span></div><button class="btn btn-primary" id="checkout-btn">Continuar pedido</button></aside></div></main><button class="btn btn-primary mobile-cart" id="mobile-cart"><span>Ver pedido</span><span id="mobile-total">R$ 0,00</span></button><div class="modal store-modal" id="product-store-modal"><div class="modal-card"><div class="modal-head"><h2 id="store-product-title">Produto</h2><button class="icon-btn" data-close>×</button></div><p id="store-product-description"></p><div id="store-options"></div><div class="field" style="margin-top:14px"><label>Observação</label><textarea id="item-note" rows="3" placeholder="Ex.: sem cebola"></textarea></div><div class="actions" style="justify-content:space-between"><div class="qty"><button id="qty-minus">−</button><b id="qty-value">1</b><button id="qty-plus">+</button></div><button class="btn btn-primary" id="add-cart-btn">Adicionar • R$ 0,00</button></div></div></div><div class="modal store-modal" id="checkout-modal"><div class="modal-card"><div class="modal-head"><h2>Finalizar pedido</h2><button class="icon-btn" data-close>×</button></div><form id="checkout-form"><div class="form-grid"><div class="field full"><label>Nome</label><input name="name" required></div><div class="field full"><label>WhatsApp</label><input name="phone" required inputmode="tel"></div><div class="field full"><label>Tipo do pedido</label><select name="type" id="delivery-type"><option value="delivery">Entrega</option><option value="pickup">Retirada no balcão</option></select></div><div class="field full" id="address-field"><label>Endereço completo</label><textarea name="address" rows="3" placeholder="Rua, número, bairro e complemento"></textarea></div><div class="field full"><label>Pagamento</label><select name="payment"><option>PIX</option><option>Cartão na entrega</option><option>Dinheiro</option></select></div><div class="field full"><label>Observações do pedido</label><textarea name="notes" rows="2"></textarea></div></div><div class="cart-total"><span>Total com entrega</span><span id="checkout-total"></span></div><button class="btn btn-primary" style="width:100%">Confirmar pedido</button></form></div></div><div class="modal store-modal" id="success-modal"><div class="modal-card" style="text-align:center"><div style="font-size:54px">✓</div><h2>Pedido enviado!</h2><p id="success-message"></p><div class="actions" style="justify-content:center"><a class="btn btn-secondary" href="cliente.html">Acompanhar pedido</a><button class="btn btn-primary" onclick="location.reload()">Fazer novo pedido</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="js/supabase.js"></script><script src="js/loja.js"></script></body></html>

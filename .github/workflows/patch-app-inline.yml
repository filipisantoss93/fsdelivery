name: Aplicar correção inline do painel

on:
  push:
    branches:
      - agent/remover-inline-app
    paths:
      - 'tools/patch-app-inline.mjs'
      - '.github/workflows/patch-app-inline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remover-inline-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar transformação
        run: node tools/patch-app-inline.mjs
      - name: Validar resultado
        run: |
          node --check js/app-ui-sync.js
          ! grep -q '<style>' app.html
          ! grep -q 'MutationObserver' app.html
          grep -q 'js/app-ui-sync.js' app.html
      - name: Publicar transformação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html css/app-polish.css js/app-ui-sync.js .github/workflows/patch-app-inline.yml tools/patch-app-inline.mjs
          git commit -m 'Remover CSS e JavaScript inline do painel'
          git push origin HEAD:agent/remover-inline-app

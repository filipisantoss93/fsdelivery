name: Auditoria de pedidos

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - '*.html'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/auditoria-pedidos.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - '*.html'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/auditoria-pedidos.yml'

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar sintaxe dos scripts críticos
        run: |
          scripts=(
            js/supabase.js
            js/loja-operacional.js
            js/loja-fluxos-pedido.js
            js/loja-publica-consolidado.js
            js/loja-pos-envio.js
            js/balcao.js
            js/garcom.js
            js/garcom-core.js
            js/cozinha.js
            js/caixa.js
            js/entregador-core.js
            js/entregador-operational.js
            js/cliente.js
            js/clientes-enderecos.js
            js/app-orders-operational.js
            js/app-orders-type-filters.js
            js/app-ui-sync.js
          )
          for script in "${scripts[@]}"; do
            if [ ! -f "$script" ]; then
              echo "Arquivo crítico ausente: $script"
              exit 1
            fi
            node --check "$script"
          done

      - name: Validar regras dos fluxos de pedidos
        run: node tests/auditoria-pedidos-estatica.mjs

      - name: Validar estabilidade do frontend
        run: node tests/auditoria-estabilidade-frontend.mjs

      - name: Executar fluxo comportamental de rastreamento
        run: node tests/rastreamento-pedido-fluxo.mjs

      - name: Auditar plataforma, assets e pagamentos
        run: node tests/auditoria-plataforma.mjs

      - name: Verificar sintaxe de todos os scripts do frontend
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Bloquear duplicidades relevantes de CSS e JavaScript
        run: npx --yes jscpd@4.0.5 --min-lines 10 --min-tokens 70 --threshold 0 --ignore 'js/vendor/**' --reporters console --format 'javascript,css,html' js css *.html

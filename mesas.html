<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18120e">
  <title>Mesas e QR Codes — FS Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-polish.css">
  <link rel="stylesheet" href="css/mesas.css">
</head>
<body class="app-body tables-admin-body">
  <aside class="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark">FS</span><span>Delivery</span></a>
    <nav class="nav">
      <button type="button" onclick="location.href='app.html'">Início</button>
      <button type="button" onclick="location.href='app.html#pedidos'">Pedidos</button>
      <button type="button" onclick="location.href='app.html#cardapio'">Cardápio</button>
      <button class="active" type="button">Mesas e QR Codes</button>
      <button type="button" onclick="location.href='app.html#configuracoes'">Configurações</button>
    </nav>
    <div class="sidebar-footer"><a class="btn btn-secondary btn-block" href="app.html">Voltar ao painel</a></div>
  </aside>
  <main class="tables-shell">
    <header class="topbar"><b>Mesas e QR Codes</b><div class="topbar-actions"><button class="btn btn-secondary" id="print-all" type="button">Imprimir todos</button><button class="btn btn-primary" id="new-table-focus" type="button">Adicionar mesa</button></div></header>
    <div class="content">
      <div class="page-head"><div><h1>QR Codes das mesas</h1><p>Gere, visualize, baixe e imprima placas no padrão visual do FS Delivery.</p></div></div>
      <section class="panel" style="margin-bottom:18px">
        <form id="table-form" class="table-form">
          <div class="field"><label for="table-number">Número</label><input id="table-number" type="number" min="1" required></div>
          <div class="field"><label for="table-name">Nome personalizado</label><input id="table-name" placeholder="Ex.: Varanda 1"></div>
          <button class="btn btn-primary" type="submit">Criar mesa</button>
        </form>
      </section>
      <section class="tables-grid" id="tables-grid"><div class="empty-state qr-empty">Carregando mesas...</div></section>
    </div>
  </main>
  <script src="js/vendor/supabase-2.112.2.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/supabase.js"></script>
  <script src="js/mesas.js"></script>
</body>
</html>

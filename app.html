<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18120e">
  <title>Painel — FS Delivery</title>
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="icons/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-polish.css">
</head>
<body class="app-body">
  <aside class="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark">FS</span><span>Delivery</span></a>
    <nav class="nav" aria-label="Navegação principal"></nav>
    <div class="sidebar-footer">
      <small>Plano Pro • 7 dias grátis</small>
      <a class="btn btn-secondary btn-block" href="loja.html" target="_blank" rel="noopener">Abrir loja pública</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><b id="page-title">Início</b></div>
      <div class="topbar-actions">
        <span id="store-status-label" aria-live="polite">Loja fechada</span>
        <button class="status store-status-control" id="store-status-button" type="button" aria-label="Alterar status da loja"></button>
        <div class="notification-wrap">
          <button class="icon-btn notification-button" id="notification-button" type="button" title="Notificações" aria-label="Abrir notificações" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
            <span class="notification-badge" id="notification-badge">0</span>
          </button>
          <div class="notification-panel" id="notification-panel">
            <div class="notification-head"><strong>Notificações</strong><button type="button" id="notification-mark-all">Marcar todas como lidas</button></div>
            <div class="notification-list" id="notification-list"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <section id="inicio" class="page active">
        <div class="page-head">
          <div><h1>Olá</h1><p>Acompanhe a operação da sua loja hoje.</p></div>
          <button class="btn btn-primary" data-go="pedidos">Ver pedidos</button>
        </div>
        <div class="metrics">
          <div class="metric"><small>Pedidos hoje</small><strong id="metric-orders">0</strong></div>
          <div class="metric"><small>Em preparo</small><strong id="summary-preparing">0</strong></div>
          <div class="metric"><small>Vendas hoje</small><strong id="metric-revenue">R$ 0,00</strong></div>
          <div class="metric"><small>Ticket médio hoje</small><strong id="metric-ticket">R$ 0,00</strong></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Pedidos recentes</h2><button class="btn btn-secondary" data-go="pedidos">Ver todos</button></div>
          <div id="dashboard-product-alert"></div>
          <div id="recent-orders" class="order-list"></div>
        </div>
      </section>

      <section id="pedidos" class="page"></section>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="Navegação principal"></nav>

  <div class="modal" id="order-modal">
    <div class="modal-card">
      <div class="modal-head"><h2 id="order-modal-title">Pedido</h2><button class="icon-btn" data-close>×</button></div>
      <div id="order-detail" class="print-area"></div>
      <div class="actions"><button class="btn btn-secondary" id="print-order">Imprimir pedido</button><button class="btn btn-primary" id="advance-order">Avançar status</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin-access.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>

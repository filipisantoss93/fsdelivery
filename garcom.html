<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18120e"><title>Garçom — FS Delivery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="app-body"><aside class="sidebar"><a class="brand" href="app.html"><span class="brand-mark">FS</span><span>Delivery</span></a><nav class="nav"><button onclick="location.href='app.html'">Painel</button><button class="active">Novo pedido</button></nav><div class="sidebar-footer"><small style="color:var(--muted)">Atendimento presencial</small><a class="btn btn-secondary" style="width:100%;margin-top:12px" href="app.html">Voltar ao painel</a></div></aside><main class="main"><header class="topbar"><div><b>Pedido do garçom</b></div><div class="topbar-actions"><span class="status pronto" id="waiter-store-status">Carregando</span></div></header><div class="content"><div class="page-head"><div><h1>Novo pedido</h1><p>Use o mesmo cardápio da loja e escolha onde o pedido será atendido.</p></div></div><div class="grid-2"><section><div class="toolbar"><input class="search" id="waiter-search" placeholder="Buscar no cardápio..."><select class="search" id="waiter-category"><option value="">Todas as categorias</option></select></div><div class="panel"><div id="waiter-products" class="product-list"></div></div></section><aside class="panel" style="height:max-content;position:sticky;top:96px"><div class="panel-head"><div><h2>Pedido</h2><p id="waiter-destination-label">Selecione o atendimento</p></div></div><div class="form-grid"><div class="field full"><label>Atendimento</label><select id="waiter-type"><option value="mesa">Mesa</option><option value="entrega">Entrega</option><option value="retirada">Retirada</option><option value="local">Vem comer</option></select></div><div class="field full" id="waiter-table-field"><label>Mesa</label><select id="waiter-table"></select></div><div class="field full"><label>Nome do cliente ou referência</label><input id="waiter-name" placeholder="Ex.: João ou Balcão 3"></div><div class="field full"><label>WhatsApp</label><input id="waiter-phone" inputmode="tel" placeholder="Opcional para mesa/local"></div><div class="field full" id="waiter-address-field" style="display:none"><label>Endereço completo</label><textarea id="waiter-address" rows="3"></textarea></div><div class="field full"><label>Pagamento</label><select id="waiter-payment"><option>PIX</option><option>Cartão</option><option>Dinheiro</option><option>Pagamento no caixa</option></select></div><div class="field full"><label>Observações</label><textarea id="waiter-notes" rows="2"></textarea></div></div><div id="waiter-cart" class="order-list" style="margin-top:18px"></div><div class="cart-total"><span>Total</span><span id="waiter-total">R$ 0,00</span></div><button class="btn btn-primary btn-block" id="waiter-submit">Enviar pedido</button></aside></div></div></main><div class="modal" id="waiter-product-modal"><div class="modal-card"><div class="modal-head"><h2 id="waiter-product-title">Produto</h2><button class="icon-btn" data-close>×</button></div><p id="waiter-product-description" style="color:var(--muted)"></p><div class="field"><label>Quantidade</label><div class="inline-actions"><button class="btn btn-secondary" id="waiter-minus" type="button">−</button><strong id="waiter-qty" style="padding:10px">1</strong><button class="btn btn-secondary" id="waiter-plus" type="button">+</button></div></div><div class="field" style="margin-top:14px"><label>Observação do item</label><textarea id="waiter-item-note" rows="3"></textarea></div><div class="actions"><button class="btn btn-secondary" data-close type="button">Cancelar</button><button class="btn btn-primary" id="waiter-add" type="button">Adicionar</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="js/supabase.js"></script><script src="js/garcom.js"></script></body></html>
